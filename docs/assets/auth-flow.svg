<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="h6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E1B4B"/><stop offset="1" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="960" height="360" fill="#F8FAFC"/>
  <rect width="960" height="52" fill="url(#h6)"/>
  <text x="24" y="33" fill="#fff" font-size="20" font-weight="700">Lexi AI — Authentication Flow (Supabase JWT)</text>

  <!-- lifelines -->
  <g font-size="13" font-weight="600">
    <rect x="40"  y="80" width="140" height="44" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="110" y="107" text-anchor="middle" fill="#312E81">👤 User</text>
    <rect x="270" y="80" width="150" height="44" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="345" y="107" text-anchor="middle" fill="#312E81">🖥️ Next.js</text>
    <rect x="540" y="80" width="150" height="44" rx="8" fill="#FAF5FF" stroke="#9333EA" stroke-width="2"/><text x="615" y="107" text-anchor="middle" fill="#581C87">🔐 Supabase Auth</text>
    <rect x="790" y="80" width="140" height="44" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><text x="860" y="107" text-anchor="middle" fill="#134E4A">⚙️ FastAPI</text>
  </g>
  <g stroke="#CBD5E1" stroke-dasharray="4 4">
    <line x1="110" y1="124" x2="110" y2="320"/><line x1="345" y1="124" x2="345" y2="320"/>
    <line x1="615" y1="124" x2="615" y2="320"/><line x1="860" y1="124" x2="860" y2="320"/>
  </g>

  <g font-size="11" fill="#334155">
    <line x1="110" y1="155" x2="345" y2="155" stroke="#64748B" stroke-width="2" marker-end="url(#a6)"/>
    <text x="228" y="148" text-anchor="middle">email + password</text>

    <line x1="345" y1="180" x2="615" y2="180" stroke="#64748B" stroke-width="2" marker-end="url(#a6)"/>
    <text x="480" y="173" text-anchor="middle">signIn() → verify credentials</text>

    <line x1="615" y1="205" x2="345" y2="205" stroke="#64748B" stroke-width="2" marker-end="url(#a6)"/>
    <text x="480" y="198" text-anchor="middle">access JWT + refresh token</text>

    <line x1="345" y1="230" x2="860" y2="230" stroke="#64748B" stroke-width="2" marker-end="url(#a6)"/>
    <text x="600" y="223" text-anchor="middle">Authorization: Bearer &lt;JWT&gt;</text>

    <line x1="860" y1="255" x2="615" y2="255" stroke="#64748B" stroke-width="2" marker-end="url(#a6)"/>
    <text x="737" y="248" text-anchor="middle">verify token (Auth API)</text>

    <line x1="860" y1="280" x2="345" y2="280" stroke="#16A34A" stroke-width="2" marker-end="url(#a6)"/>
    <text x="600" y="273" text-anchor="middle" fill="#14532D">200 · user-scoped data (or 401)</text>
  </g>

  <g font-size="11">
    <rect x="200" y="300" width="560" height="44" rx="8" fill="#FEF3C7" stroke="#D97706"/>
    <text x="480" y="318" text-anchor="middle" fill="#78350F" font-weight="600">On 401: refresh session ONCE → retry request ONCE → on failure sign out gracefully</text>
    <text x="480" y="336" text-anchor="middle" fill="#92400E">no loops · polling terminates cleanly · ownership enforced server-side on every query</text>
  </g>
</svg>
