<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="h5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E1B4B"/><stop offset="1" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="960" height="380" fill="#F8FAFC"/>
  <rect width="960" height="52" fill="url(#h5)"/>
  <text x="24" y="33" fill="#fff" font-size="20" font-weight="700">Lexi AI — RAG Chat Flow (grounded answers with citations)</text>

  <text x="120" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#312E81">INDEXING (once per document)</text>
  <g font-size="12" fill="#1E293B">
    <rect x="30"  y="110" width="180" height="56" rx="10" fill="#fff" stroke="#C7D2FE" stroke-width="2"/>
    <text x="120" y="132" text-anchor="middle" font-weight="600">Extracted clauses</text>
    <text x="120" y="150" text-anchor="middle" font-size="10">from completed analysis</text>

    <rect x="270" y="110" width="180" height="56" rx="10" fill="#FAF5FF" stroke="#9333EA" stroke-width="2"/>
    <text x="360" y="132" text-anchor="middle" font-weight="600">Embed (1536-d)</text>
    <text x="360" y="150" text-anchor="middle" font-size="10">Gemini embeddings</text>

    <rect x="510" y="110" width="180" height="56" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="600" y="132" text-anchor="middle" font-weight="600">ChromaDB collection</text>
    <text x="600" y="150" text-anchor="middle" font-size="10">persistent · per user</text>
  </g>
  <g stroke="#64748B" stroke-width="2" fill="none">
    <line x1="210" y1="138" x2="266" y2="138" marker-end="url(#a5)"/>
    <line x1="450" y1="138" x2="506" y2="138" marker-end="url(#a5)"/>
  </g>

  <text x="480" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#134E4A">QUERY (per question)</text>
  <g font-size="12" fill="#1E293B">
    <rect x="30"  y="235" width="150" height="56" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <text x="105" y="257" text-anchor="middle" font-weight="600">❓ Question</text>
    <text x="105" y="275" text-anchor="middle" font-size="10">user chat message</text>

    <rect x="240" y="235" width="150" height="56" rx="10" fill="#FAF5FF" stroke="#9333EA" stroke-width="2"/>
    <text x="315" y="257" text-anchor="middle" font-weight="600">Embed question</text>
    <text x="315" y="275" text-anchor="middle" font-size="10">same model · same dim</text>

    <rect x="450" y="235" width="150" height="56" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="525" y="257" text-anchor="middle" font-weight="600">Top-k retrieval</text>
    <text x="525" y="275" text-anchor="middle" font-size="10">most relevant clauses</text>

    <rect x="660" y="235" width="130" height="56" rx="10" fill="#FAF5FF" stroke="#9333EA" stroke-width="2"/>
    <text x="725" y="257" text-anchor="middle" font-weight="600">Grounded prompt</text>
    <text x="725" y="275" text-anchor="middle" font-size="10">clauses + question</text>

    <rect x="820" y="235" width="120" height="56" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
    <text x="880" y="257" text-anchor="middle" font-weight="600">✅ Answer</text>
    <text x="880" y="275" text-anchor="middle" font-size="10">cites its clauses</text>
  </g>
  <g stroke="#64748B" stroke-width="2" fill="none">
    <line x1="180" y1="263" x2="236" y2="263" marker-end="url(#a5)"/>
    <line x1="390" y1="263" x2="446" y2="263" marker-end="url(#a5)"/>
    <line x1="600" y1="263" x2="656" y2="263" marker-end="url(#a5)"/>
    <line x1="790" y1="263" x2="816" y2="263" marker-end="url(#a5)"/>
    <!-- retrieval reads the collection -->
    <path d="M 600 166 C 560 200, 540 215, 527 231" marker-end="url(#a5)"/>
  </g>

  <text x="480" y="340" text-anchor="middle" font-size="11" fill="#475569">Retrieval failure degrades gracefully (empty results — never a crash) · concurrent chats share the index, never re-index · prompt-injection hardened</text>
</svg>
